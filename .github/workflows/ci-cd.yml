name: Enterprise DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ===========================================================================
  # 1. SPRING BOOT 4 / JAVA 25 BACKEND TEST & BUILD
  # ===========================================================================
  backend-build:
    name: Backend Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Backend
        working-directory: backend
        run: |
          mvn clean test

      - name: Package JAR Artifact
        working-directory: backend
        run: |
          mvn package -DskipTests

  # ===========================================================================
  # 2. PYTHON FASTAPI & LANGGRAPH AI ENGINE TEST
  # ===========================================================================
  ai-engine-test:
    name: AI Engine Multi-Agent Verification (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install AI Dependencies
        working-directory: ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest (LangGraph DAG & RAG Verification)
        working-directory: ai-engine
        run: |
          PYTHONPATH=. pytest tests/ -v

  # ===========================================================================
  # 3. REACT + TYPESCRIPT + VITE FRONTEND TEST & BUILD
  # ===========================================================================
  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: TypeScript Verification and Vite Build
        working-directory: frontend
        run: |
          npm run build

  # ===========================================================================
  # 4. DOCKER COMPOSE CONFIGURATION VALIDATION
  # ===========================================================================
  docker-validation:
    name: Docker & Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose -f deployments/docker-compose.yml config

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f deployments/kubernetes/
