apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-config
  namespace: devops-incident-system
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "devops_incident_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  AI_ENGINE_URL: "http://ai-engine-service:8000"
  PROMETHEUS_URL: "http://prometheus-service:9090"
  LOKI_URL: "http://loki-service:3100"
  JAEGER_URL: "http://jaeger-service:16686"
