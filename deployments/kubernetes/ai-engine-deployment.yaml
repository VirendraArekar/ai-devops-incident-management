apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine-deployment
  namespace: devops-incident-system
  labels:
    app: devops-ai-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ai-engine
  template:
    metadata:
      labels:
        app: devops-ai-engine
    spec:
      containers:
        - name: ai-engine
          image: devops-ai-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine-service
  namespace: devops-incident-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: devops-ai-engine
