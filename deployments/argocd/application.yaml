apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-incident-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/enterprise/devops-incident-platform.git'
    targetRevision: HEAD
    path: deployments/helm/devops-incident-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-incident-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
